server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Storybook genera assets con hash en el nombre: cachea fuerte.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
